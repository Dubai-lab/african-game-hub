<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f2a7a" />
    <title>African Game Hub</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 24px; box-sizing: border-box; text-align: center;
        background: #1f2a7a; color: #eef0fa; font: 17px/1.45 system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      }
      .mark { display: grid; grid-template-columns: 44px 44px; }
      .mark i { width: 44px; height: 44px; background: #f5b700; }
      .mark i:nth-child(2), .mark i:nth-child(3) { background: #eef0fa; }
      h1 { margin: 10px 0 0; font-size: 24px; font-weight: 800; }
      p { margin: 0; max-width: 20em; color: #c9cff0; }
      button {
        margin-top: 10px; min-height: 52px; min-width: 200px; padding: 0 28px; border: 0; border-radius: 6px;
        background: #f5b700; color: #14183d; font: inherit; font-weight: 700;
      }
      button:disabled { opacity: 0.6; }
    </style>
  </head>
  <body>
    <div class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <h1 id="title">No connection</h1>
    <p id="body">African Game Hub needs the internet to play. Check your connection and try again.</p>
    <button id="retry" type="button">Try again</button>
    <script>
      // The shell's own page: shown when the site cannot be reached. Two languages, like the site.
      var french = /^fr\b/i.test(navigator.language || '')
      var words = french
        ? { title: 'Pas de connexion', body: 'African Game Hub a besoin d’Internet pour jouer. Vérifiez votre connexion et réessayez.', retry: 'Réessayer', trying: 'Connexion…' }
        : { title: 'No connection', body: 'African Game Hub needs the internet to play. Check your connection and try again.', retry: 'Try again', trying: 'Connecting…' }
      if (french) document.documentElement.lang = 'fr'
      var button = document.getElementById('retry')
      document.getElementById('title').textContent = words.title
      document.getElementById('body').textContent = words.body
      button.textContent = words.retry
      // Where the app goes once there is a connection: the same address as in capacitor.config.ts.
      var site = 'https://africangamehub.com/lobby'
      function open() {
        button.disabled = true
        button.textContent = words.trying
        window.location.replace(site)
        // If the site still cannot be reached this page is shown again; if nothing happens at
        // all, the button comes back.
        setTimeout(function () { button.disabled = false; button.textContent = words.retry }, 8000)
      }
      button.addEventListener('click', open)
      // The connection came back while the page was open: go without being asked.
      window.addEventListener('online', open)
    </script>
  </body>
</html>

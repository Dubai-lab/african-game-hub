# Builds the Android and iPhone test apps (see mobile/README.md), on GitHub's own machines.
#
# Started by hand only: Actions tab -> "Phone test apps" -> Run workflow. The finished apps are
# under "Artifacts" at the bottom of the run's page.
#   - AfricanGameHub-test.apk       installs straight onto an Android phone
#   - AfricanGameHub-unsigned.ipa   goes onto an iPhone with Sideloadly
# Neither needs a Google or Apple developer account.
name: Phone test apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android test app (APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install the app shell
        working-directory: mobile
        run: npm ci
      - name: Copy the settings into the Android project
        working-directory: mobile
        run: npx cap sync android
      - name: Build the APK
        working-directory: mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/AfricanGameHub-test.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: AfricanGameHub-test-apk
          path: AfricanGameHub-test.apk
          if-no-files-found: error

  ios:
    name: iPhone test app (unsigned IPA)
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install the app shell
        working-directory: mobile
        run: npm ci
      - name: Copy the settings into the iPhone project
        working-directory: mobile
        run: npx cap sync ios
      - name: Fetch the Swift packages
        working-directory: mobile/ios/App
        run: |
          xcodebuild -version
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -scmProvider system \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages"
      - name: Build the app without signing it
        working-directory: mobile/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/ios-build" \
            -scmProvider system \
            -clonedSourcePackagesDirPath "$RUNNER_TEMP/swift-packages" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Pack it as an IPA
        run: |
          cd "$RUNNER_TEMP"
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry "$GITHUB_WORKSPACE/AfricanGameHub-unsigned.ipa" Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AfricanGameHub-unsigned-ipa
          path: AfricanGameHub-unsigned.ipa
          if-no-files-found: error

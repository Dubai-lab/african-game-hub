# Builds the Android and iPhone apps (see mobile/README.md).
#
# Both are test builds: nothing here needs a Google or Apple developer account.
#   - Android: an APK that installs straight onto a phone.
#   - iPhone:  an unsigned IPA, to be put on a phone with Sideloadly.
# Builds are started by hand in Codemagic, so no build minutes are spent on ordinary pushes.

definitions:
  shell: &shell
    name: Install the app shell
    script: |
      cd mobile
      npm ci

workflows:
  android-test:
    name: Android test app (APK)
    instance_type: mac_mini_m2
    max_build_duration: 30
    environment:
      node: 22
      java: 21
    scripts:
      - *shell
      - name: Copy the settings into the Android project
        script: |
          cd mobile
          npx cap sync android
      - name: Build the APK
        script: |
          cd mobile/android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk "$CM_BUILD_DIR/AfricanGameHub-test.apk"
    artifacts:
      - AfricanGameHub-test.apk

  ios-test:
    name: iPhone test app (unsigned IPA for Sideloadly)
    instance_type: mac_mini_m2
    # A build that has not finished in half an hour is stuck: stop it and keep the minutes.
    max_build_duration: 30
    environment:
      node: 22
      xcode: latest
    scripts:
      - *shell
      - name: Copy the settings into the iPhone project
        script: |
          cd mobile
          npx cap sync ios
      # Its own step, so that if fetching the packages is what stalls, the build says so. The
      # packages are fetched with the machine's own git (-scmProvider system): Xcode's built-in
      # one is known to hang on build machines.
      - name: Fetch the Swift packages
        script: |
          cd mobile/ios/App
          xcodebuild -version
          xcodebuild -resolvePackageDependencies \
            -project App.xcodeproj \
            -scheme App \
            -scmProvider system \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/swift-packages"
      - name: Build the app without signing it
        script: |
          cd mobile/ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$CM_BUILD_DIR/ios-build" \
            -scmProvider system \
            -clonedSourcePackagesDirPath "$CM_BUILD_DIR/swift-packages" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            build
      - name: Pack it as an IPA
        script: |
          cd "$CM_BUILD_DIR"
          rm -rf Payload
          mkdir Payload
          cp -R ios-build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry AfricanGameHub-unsigned.ipa Payload
    artifacts:
      - AfricanGameHub-unsigned.ipa
